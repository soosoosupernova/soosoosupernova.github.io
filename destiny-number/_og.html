<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>OG 생성</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&display=swap">
<style>body{margin:0;background:#222}canvas{display:block}</style>
<canvas id="c" width="1200" height="630"></canvas>
<script>
var F_BODY = '"Pretendard Variable", Pretendard, sans-serif';
var F_ROUND = 'Jua, "Pretendard Variable", Pretendard, sans-serif';
var F_MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';
var cv = document.getElementById('c'), ctx = cv.getContext('2d');

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function blob(cx, cy, size, color) {
  var s = size / 120;
  ctx.save();
  ctx.translate(cx - size / 2, cy - size / 2);
  ctx.scale(s, s);
  ctx.beginPath();
  ctx.moveTo(62, 16);
  ctx.bezierCurveTo(85, 16, 103, 31, 103, 50);
  ctx.bezierCurveTo(103, 57, 101, 62, 97, 66);
  ctx.bezierCurveTo(100, 70, 101, 75, 101, 80);
  ctx.bezierCurveTo(101, 98, 84, 110, 62, 110);
  ctx.bezierCurveTo(40, 110, 23, 98, 23, 80);
  ctx.bezierCurveTo(23, 75, 24, 71, 27, 67);
  ctx.bezierCurveTo(23, 63, 21, 58, 21, 50);
  ctx.bezierCurveTo(21, 31, 39, 16, 62, 16);
  ctx.closePath();
  ctx.fillStyle = color; ctx.fill();
  ctx.lineWidth = 2.6; ctx.strokeStyle = 'rgba(58,48,43,.20)'; ctx.stroke();
  ctx.fillStyle = '#3A302B';
  ctx.beginPath(); ctx.ellipse(47, 60, 4.4, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(75, 60, 4.4, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(242,145,174,.55)';
  ctx.beginPath(); ctx.ellipse(35, 74, 7, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(87, 74, 7, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#3A302B'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(55, 72); ctx.quadraticCurveTo(61, 79, 67, 72); ctx.stroke();
  ctx.restore();
}

function heart(x, y, s, color) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 24, s / 24);
  ctx.beginPath();
  ctx.moveTo(12, 20.2);
  ctx.bezierCurveTo(9, 17.6, 4, 14.6, 4, 9.9);
  ctx.bezierCurveTo(4, 7.4, 6, 5.5, 8.4, 5.5);
  ctx.bezierCurveTo(10, 5.5, 11.3, 6.4, 12, 7.6);
  ctx.bezierCurveTo(12.7, 6.4, 14, 5.5, 15.6, 5.5);
  ctx.bezierCurveTo(18, 5.5, 20, 7.4, 20, 9.9);
  ctx.bezierCurveTo(20, 14.6, 15, 17.6, 12, 20.2);
  ctx.closePath(); ctx.fillStyle = color; ctx.fill(); ctx.restore();
}

function draw() {
  var W = 1200, H = 630;
  ctx.fillStyle = '#FBF8F3'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(224,205,182,.45)'; ctx.lineWidth = 1;
  for (var gx = 0; gx <= W; gx += 30) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke(); }
  for (var gy = 0; gy <= H; gy += 30) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke(); }

  var g1 = ctx.createRadialGradient(90, 30, 10, 90, 30, 300);
  g1.addColorStop(0, 'rgba(255,214,106,.55)'); g1.addColorStop(1, 'rgba(255,214,106,0)');
  ctx.fillStyle = g1; ctx.fillRect(0, 0, 520, 420);
  var g2 = ctx.createRadialGradient(1140, 600, 10, 1140, 600, 320);
  g2.addColorStop(0, 'rgba(116,199,168,.34)'); g2.addColorStop(1, 'rgba(116,199,168,0)');
  ctx.fillStyle = g2; ctx.fillRect(620, 300, 580, 330);

  // 상단
  ctx.fillStyle = '#3A302B'; ctx.font = '30px ' + F_ROUND; ctx.textBaseline = 'alphabetic';
  ctx.fillText('수수수 웹툴', 64, 78);
  ctx.fillStyle = '#7A6A5F'; ctx.font = '20px ' + F_MONO; ctx.textAlign = 'right';
  ctx.fillText('DESTINY NUMBER · 2027', W - 64, 76); ctx.textAlign = 'left';

  // 헤드라인
  ctx.fillStyle = '#3A302B'; ctx.font = '78px ' + F_ROUND;
  ctx.fillText('생일 여덟 자리로', 64, 196);
  ctx.fillText('내 숫자 뽑기', 64, 286);
  ctx.fillStyle = '#6B5D54'; ctx.font = '27px ' + F_BODY;
  ctx.fillText('운명 수 1~9, 마스터 수 11·22·33, 2027년 개인년수,', 64, 348);
  ctx.fillText('탄생 타로 카드까지 한 장에. 3초면 끝나요.', 64, 388);

  // 칩
  var chips = [['운명 수 · 마스터 수', '#FFE9AE', '#8A6413'], ['2027 개인년수', '#D5F1E4', '#21705A'], ['탄생 타로 카드', '#DCEDFB', '#2F6B96']];
  var px = 64;
  chips.forEach(function (c) {
    ctx.font = '600 21px ' + F_BODY;
    var tw = ctx.measureText(c[0]).width;
    rr(px, 424, tw + 40, 46, 23);
    ctx.fillStyle = c[1]; ctx.fill();
    ctx.strokeStyle = 'rgba(58,48,43,.14)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = c[2]; ctx.fillText(c[0], px + 20, 454);
    px += tw + 56;
  });

  // 오른쪽 창 카드
  var cx = 690, cy = 96, cw = 446, ch = 456;
  ctx.save();
  ctx.shadowColor = 'rgba(94,70,48,.16)'; ctx.shadowBlur = 26; ctx.shadowOffsetY = 10;
  rr(cx, cy, cw, ch, 30); ctx.fillStyle = '#FFFDF9'; ctx.fill();
  ctx.restore();
  ctx.save(); rr(cx, cy, cw, ch, 30); ctx.clip();
  ctx.fillStyle = '#FFE9AE'; ctx.fillRect(cx, cy, cw, 58);
  ctx.restore();
  rr(cx, cy, cw, ch, 30); ctx.strokeStyle = '#EFE3D4'; ctx.lineWidth = 4; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy + 58); ctx.lineTo(cx + cw, cy + 58); ctx.strokeStyle = '#EFE3D4'; ctx.lineWidth = 3; ctx.stroke();
  ['#F291AE', '#FFD06A', '#74C7A8'].forEach(function (c, i) {
    ctx.beginPath(); ctx.arc(cx + 32 + i * 24, cy + 29, 8, 0, Math.PI * 2);
    ctx.fillStyle = c; ctx.fill();
  });
  ctx.fillStyle = 'rgba(58,48,43,.6)'; ctx.font = '17px ' + F_MONO;
  ctx.fillText('MY NUMBER.EXE', cx + 108, cy + 35);

  ctx.fillStyle = '#6B5D54'; ctx.font = '18px ' + F_MONO;
  ctx.fillText('DESTINY NUMBER', cx + 40, cy + 118);
  ctx.fillStyle = '#B87A18'; ctx.font = '150px ' + F_ROUND;
  ctx.fillText('5', cx + 36, cy + 268);
  ctx.fillStyle = '#7A6A5F'; ctx.font = '26px ' + F_MONO;
  ctx.fillText('번', cx + 128, cy + 228);

  blob(cx + cw - 116, cy + 200, 156, '#FFD870');

  ctx.fillStyle = '#3A302B'; ctx.font = '38px ' + F_ROUND;
  ctx.fillText('바람처럼 다니는 고양이', cx + 38, cy + 330);
  ctx.fillStyle = '#6B5D54'; ctx.font = '22px ' + F_BODY;
  ctx.fillText('새로운 걸 만나면 눈이 반짝이는 사람', cx + 38, cy + 368);

  for (var k = 0; k < 5; k++) { heart(cx + 40 + k * 36, cy + 396, 26, k < 4 ? '#E2748F' : '#E4DCCB'); }
  ctx.fillStyle = '#7A6A5F'; ctx.font = '18px ' + F_MONO;
  ctx.fillText('직관 4 · 행동 4 · 애정 4 · 재물 3', cx + 40, cy + 442);

  // 푸터
  ctx.fillStyle = '#7A6A5F'; ctx.font = '22px ' + F_MONO;
  ctx.fillText('soosoosupernova.github.io/destiny-number', 64, 572);
  ctx.textAlign = 'right';
  ctx.fillText('무료 · 회원가입 없음', W - 64, 572);
  ctx.textAlign = 'left';
}

document.fonts.ready.then(function () {
  return Promise.all([
    document.fonts.load('400 80px Jua'),
    document.fonts.load('400 30px "Pretendard Variable"'),
    document.fonts.load('600 30px "Pretendard Variable"')
  ]);
}).then(function () {
  return new Promise(function (r) { setTimeout(r, 300); });
}).then(function () {
  draw();
  cv.toBlob(function (bin) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(bin);
    a.download = 'og-image.png';
    document.body.appendChild(a); a.click();
  }, 'image/png');
});
</script>
</html>
