<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Caveat:wght@600&display=swap">
<style>
  *{box-sizing:border-box;margin:0}
  body{background:#CFC7B8;display:flex;justify-content:center;align-items:flex-start;padding:0}
  .og{
    width:1200px;height:630px;background:#FAF6EC;color:#2D2724;overflow:hidden;position:relative;
    display:grid;grid-template-columns:1fr 430px;align-items:center;padding:0 64px;
    font-family:'Pretendard Variable',Pretendard,sans-serif;
  }
  .copy{padding-right:8px}
  .brand{font-family:'Gowun Dodum',sans-serif;font-size:22px;letter-spacing:-.01em}
  .brand small{display:block;font-family:'Pretendard Variable',Pretendard,sans-serif;font-size:11px;font-weight:600;letter-spacing:.24em;color:#9A8A7B;margin-top:6px;text-transform:uppercase}
  .rule{width:100%;height:1px;background:#E9DFCC;margin:26px 0 30px}
  .eyebrow{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:650;letter-spacing:.22em;color:#9A8A7B;text-transform:uppercase}
  .eyebrow::before{content:"";width:16px;height:1px;background:#DCCFB6}
  h1{font-family:'Gowun Dodum',sans-serif;font-weight:400;font-size:66px;line-height:1.28;letter-spacing:-.035em;margin:16px 0 0}
  h1 em{font-style:normal;color:#4C7E9B}
  p.sub{font-size:19px;line-height:1.75;color:#6A5A4E;margin-top:20px;max-width:520px}
  .tags{display:flex;gap:8px;margin-top:26px}
  .tags span{border:1px solid #E9DFCC;background:#FFFDF7;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:#6A5A4E}
  .art{width:100%;display:block;mix-blend-mode:multiply}
  .hand{position:absolute;right:64px;bottom:26px;font-family:'Caveat',cursive;font-size:26px;color:#B93B3B}
</style>
</head>
<body>
<div class="og" id="og" role="img" aria-label="og card">
  <div class="copy">
    <div class="brand">수수수 웹툴<small>My Little Destiny</small></div>
    <div class="rule"></div>
    <div class="eyebrow">Birthday Report</div>
    <h1>숫자로 보는<br>내 <em>2027년</em></h1>
    <p class="sub">생일 여덟 자리에 담긴 운명 수와 2027년의 흐름, 태어날 때 뽑힌 타로 카드까지 한 장에.</p>
    <div class="tags"><span>운명 수 1~9</span><span>마스터 수</span><span>2027 개인년수</span><span>탄생 타로</span></div>
  </div>
  <img class="art" src="assets/cat-hero.webp" alt="">
  <span class="hand">made with care</span>
</div>
</body>
</html>
