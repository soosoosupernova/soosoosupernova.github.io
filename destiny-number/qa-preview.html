<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>QA preview</title>
<style>
  html,body{margin:0;background:#DAD4C8}
  .wrap{padding:0;display:inline-block;line-height:0;width:max-content}
  iframe{border:0;background:#fff;display:block}
</style>
</head>
<body>
<div class="wrap" role="img" aria-label="preview frame">
  <iframe id="f" title="preview" src="/destiny-number/?v=qa5" width="375" height="812" scrolling="no"></iframe>
</div>
<script>
  var p = new URLSearchParams(location.search);
  var f = document.getElementById('f');
  var w = p.get('w'), h = p.get('h'), y = +(p.get('y') || 0), url = p.get('u');
  if (w) { f.width = w; }
  if (h) { f.height = h; }
  if (url) { f.src = url; }
  function jump() {
    try {
      var c = f.contentDocument && f.contentDocument.querySelector('canvas');
      if (c && p.get('full')) { c.style.width = '1080px'; c.style.maxWidth = 'none'; }
      if (c && c.getBoundingClientRect().height > 100) { c.scrollIntoView({ block: 'start' }); if (y) { f.contentWindow.scrollBy(0, y); } return; }
      f.contentWindow.scrollTo(0, y);
    } catch (e) {}
  }
  f.addEventListener('load', function () {
    jump(); setTimeout(jump, 700); setTimeout(jump, 1600); setTimeout(jump, 2600);
  });
</script>
</body>
</html>
