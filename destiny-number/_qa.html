<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>QA frame</title>
<style>
  html,body{margin:0;padding:0;background:#8c9a84}
  #wrap{width:375px;height:812px;transform-origin:0 0;overflow:hidden;background:#fff}
  iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<div id="wrap"><iframe id="f" src="./"></iframe></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var w = +(q.get('w') || 375), h = +(q.get('h') || 812), s = +(q.get('s') || 1);
  var u = q.get('u') || './';
  var wrap = document.getElementById('wrap');
  wrap.style.width = w + 'px';
  wrap.style.height = h + 'px';
  wrap.style.transform = 'scale(' + s + ')';
  var fr = document.getElementById('f');
  fr.addEventListener('load', function () {
    var y = +(q.get('y') || 0);
    if (y) { try { fr.contentWindow.scrollTo(0, y); } catch (e) {} }
  });
  fr.src = u;
})();
</script>
</body>
</html>
