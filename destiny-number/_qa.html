<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>QA</title>
<style>
  html,body{margin:0;background:#DAD4C8}
  .wrap{padding:10px;display:flex;gap:14px;align-items:flex-start}
  iframe{border:1px solid #444;background:#fff;display:block}
  .lbl{font:12px/1.4 sans-serif;color:#333}
</style>
</head>
<body>
<div class="wrap">
  <iframe id="f" src="./?d=1990-04-27&v=qa1" width="375" height="812" scrolling="no"></iframe>
</div>
<script>
  var p = new URLSearchParams(location.search);
  var f = document.getElementById('f');
  var w = p.get('w'), h = p.get('h'), y = +(p.get('y') || 0), url = p.get('u');
  if (w) { f.width = w; }
  if (h) { f.height = h; }
  if (url) { f.src = url; }
  f.addEventListener('load', function () {
    try { f.contentWindow.scrollTo(0, y); } catch (e) {}
  });
</script>
</body>
</html>
