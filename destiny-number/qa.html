<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1400">
<meta name="robots" content="noindex,nofollow">
<title>QA - destiny-number</title>
<style>
  body{margin:0;background:#2b2530;color:#fff;font:13px/1.5 sans-serif}
  .row{display:flex;gap:18px;padding:18px;align-items:flex-start}
  figure{margin:0}
  figcaption{font:12px monospace;color:#ffe08a;padding:4px 2px 6px}
  iframe{width:375px;height:812px;border:2px solid #ffe08a;background:#fff}
</style>
</head>
<body>
<div class="row">
  <figure><figcaption>A 랜딩</figcaption><iframe data-src="./index.html" title="landing"></iframe></figure>
  <figure><figcaption>B 결과 5 (1990-04-27)</figcaption><iframe data-src="./index.html?d=1990-04-27" data-pick="1" title="result5"></iframe></figure>
  <figure><figcaption>C 결과 11 마스터 (1985-03-12)</figcaption><iframe data-src="./index.html?d=1985-03-12" data-pick="1" title="result11"></iframe></figure>
</div>
<script>
  var frames = [].slice.call(document.querySelectorAll('iframe'));
  frames.forEach(function (f) {
    f.addEventListener('load', function () {
      try {
        if (f.dataset.pick) {
          var cards = f.contentDocument.querySelectorAll('.tcard');
          for (var i = 0; i < 3 && i < cards.length; i++) { cards[i].click(); }
        }
      } catch (e) { console.log('qa', e); }
    });
    f.src = f.dataset.src;
  });
</script>
</body>
</html>
